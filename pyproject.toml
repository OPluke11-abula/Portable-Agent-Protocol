[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-agent"
version = "0.1.0"
description = "Reference implementation of the Portable Agent Protocol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "mcp>=1.0.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
portable-agent = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
