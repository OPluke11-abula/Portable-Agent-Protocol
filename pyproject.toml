[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-agent"
version = "0.1.0"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "jsonschema"]

[project.scripts]
portable-agent = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["agent_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent_runtime --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["agent_runtime"]

[tool.coverage.report]
show_missing = true
fail_under = 80
