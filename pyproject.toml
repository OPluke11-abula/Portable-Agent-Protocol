[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-agent"

[project.scripts]
portable-agent = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["agent_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
